name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set version number
        run: |
          sed -i '/^VERSION = /c\VERSION = "${{ steps.get_version.outputs.VERSION }}"' custom_components/rivian/const.py
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.get_version.outputs.VERSION }}"/' custom_components/rivian/manifest.json

      # Pack the integration (without bytecode caches) as rivian.zip for HACS.
      - name: Zip the integration
        run: |
          cd custom_components/rivian
          zip -r rivian.zip ./ -x '*/__pycache__/*' '__pycache__/*' '*.pyc'

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/rivian/rivian.zip
