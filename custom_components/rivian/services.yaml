backfill_drive_history:
  name: Backfill drive history
  description: Reconstruct past drive efficiency and MPGe from Home Assistant recorder history through the recorder history API (any recorder database), without modifying it.
  fields:
    vin:
      name: Vehicle VIN
      description: Specific vehicle VIN to backfill (leave blank for all configured vehicles).
      example: "7FCTG..."
      selector:
        text:
    days:
      name: Days
      description: Number of past days of history to backfill (defaults to 365 days).
      example: 365
      default: 365
      selector:
        number:
          min: 1
          max: 365
          mode: box
    dry_run:
      name: Dry run
      description: If true, analyzes and logs detected drives in Home Assistant logs without saving to storage.
      default: true
      selector:
        boolean:
    tracks:
      name: Rebuild GPS routes
      description: Also rebuild GPS routes for stored drives from the recorder's location history (only the recorder retention window, ~10 days by default).
      default: true
      selector:
        boolean:

create_efficiency_dashboard:
  name: Create Rivian dashboard
  description: Generate and register the Rivian dashboard in your Home Assistant sidebar.
  fields:
    title:
      name: Dashboard Title
      description: Title displayed in the sidebar and header.
      default: "Rivian"
      example: "Rivian"
      selector:
        text:
    icon:
      name: Sidebar Icon
      description: Material Design icon for the sidebar navigation.
      default: "mdi:car-electric"
      example: "mdi:car-electric"
      selector:
        icon:
    url_path:
      name: URL Path
      description: URL slug for the dashboard.
      default: "rivian-dashboard"
      example: "rivian-dashboard"
      selector:
        text:

set_vehicle_picture:
  name: Set vehicle picture
  description: Download a picture of your vehicle from an image URL once and keep it as the vehicle's picture (shown on the Rivian dashboard's Overview). Use this when the automatic configurator picture doesn't match your car, e.g. copy the image address of your build on rivian.com.
  fields:
    vin:
      name: VIN
      description: Vehicle to set the picture for. Optional when only one Rivian is set up.
      required: false
      example: "7PDSGABA8NN000000"
      selector:
        text:
    url:
      name: Image URL
      description: Web address of a PNG, JPEG or WebP image (up to 10 MB). It is downloaded once and stored locally.
      required: true
      example: "https://rivian.com/compimg/r1s/2.2/us/exp-lgr_ord-ad3_pkg-lch_whl-1rd@3072x2688.front.webp"
      selector:
        text:

rebuild_heat_map:
  name: Rebuild road heat map
  description: Recounts the road heat map from the stored routes. Months whose routes are no longer stored keep their heat. Only needed after changing Home Assistant's time zone.
  fields:
    vin:
      name: Vehicle VIN
      description: Specific vehicle VIN to rebuild (leave blank for all configured vehicles).
      required: false
      example: "7PDSGABA8NN000000"
      selector:
        text:

recompute_drive_stats:
  name: Recompute drive summary stats
  description: Recomputes each drive's Strava-style summary stats (moving/stopped time, stop count, climb/descent, robust max speed, highway share, regen) from its stored GPS route. Live vehicle context (range, drive modes, trailer, driver) is never touched. Thinned routes (older ones simplified to save space) give slightly less accurate stop/climb numbers than a full-detail route.
  fields:
    vin:
      name: Vehicle VIN
      description: Specific vehicle VIN to recompute (leave blank for all configured vehicles).
      required: false
      example: "7PDSGABA8NN000000"
      selector:
        text:

fit_energy_model:
  name: Fit energy model
  description: Refits the anchored energy model (aerodynamic drag, rolling resistance, auxiliary power, regen efficiency) from recent routed drives; each drive's measured SoC-drop energy re-anchors the model's shape. If too few qualifying drives exist in the fitting window, any existing fit is left untouched.
  fields:
    vin:
      name: Vehicle VIN
      description: Specific vehicle VIN to refit (leave blank for all configured vehicles).
      required: false
      example: "7PDSGABA8NN000000"
      selector:
        text:

snap_route_gaps:
  name: Snap route gaps to roads
  description: Fills recorded GPS dropouts (a stretch where the live stream went quiet mid-drive) by snapping the gap onto the local OpenStreetMap road network, replacing the straight line the map otherwise draws. Uses the public Overpass API, rate-limited and cached per area; a gap that can't be matched to a road within about 50 m is left unfilled.
  fields:
    vin:
      name: Vehicle VIN
      description: Specific vehicle VIN to process (leave blank for all configured vehicles).
      required: false
      example: "7PDSGABA8NN000000"
      selector:
        text:
