            - label: Vent high
              value: Vent3
    front_right_seat: *optional_heat_level
    rear_left_seat: &optional_heat_only_level
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: Heat low
              value: Heat1
            - label: Heat medium
              value: Heat2
            - label: Heat high
              value: Heat3
    rear_right_seat: *optional_heat_only_level
    steering_wheel:
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: "On"
              value: Heat1
    override_charge_schedule:
      selector:
        boolean:

delete_departure_schedule:
  fields:
    device_id: *device_id
    schedule_id: *schedule_id
