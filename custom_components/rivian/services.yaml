backfill_drive_history:
  name: Backfill drive history
  description: Reconstruct past drive efficiency and MPGe from Home Assistant recorder history without modifying the SQLite database.
  fields:
    vin:
      name: Vehicle VIN
      description: Specific vehicle VIN to backfill (leave blank for all configured vehicles).
      example: "7FCTG..."
      selector:
        text:
    days:
      name: Days
      description: Number of past days of history to backfill (defaults to all available history).
      example: 10
      default: 10
      selector:
        number:
          min: 1
          max: 365
          mode: box
    dry_run:
      name: Dry run
      description: If true, analyzes and logs detected drives in Home Assistant logs without saving to storage.
      default: true
      selector:
        boolean:

create_efficiency_dashboard:
  name: Create efficiency dashboard
  description: Automatically generate and register a turnkey Rivian Efficiency dashboard with bundled Plotly scatterplots and telemetry cards in your Home Assistant sidebar.
  fields:
    title:
      name: Dashboard Title
      description: Title displayed in the sidebar and header.
      default: "Rivian Efficiency"
      example: "Rivian Efficiency"
      selector:
        text:
    icon:
      name: Sidebar Icon
      description: Material Design icon for the sidebar navigation.
      default: "mdi:gauge"
      example: "mdi:gauge"
      selector:
        icon:
    url_path:
      name: URL Path
      description: URL slug for the dashboard.
      default: "rivian-efficiency"
      example: "rivian-efficiency"
      selector:
        text:
