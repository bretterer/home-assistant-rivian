create_departure_schedule:
  fields:
    device_id: &device_id
      required: true
      selector:
        device:
          filter:
            - integration: rivian
          # only vehicles have a device tracker, so wallboxes aren't offered
          entity:
            - domain: device_tracker
    name:
      required: true
      example: Weekdays
      selector:
        text:
    departure_time:
      required: true
      example: "07:30:00"
      selector:
        time:
    days:
      required: true
      selector: &days_selector
        select:
          multiple: true
          options:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
    enabled:
      default: true
      selector:
        boolean:
    temperature:
      selector:
        number:
          step: 0.5
          mode: box
    front_defrost:
      default: "Off"
      selector:
        select:
          options:
            - "Off"
            - Defrost
            - Defog
    front_left_seat: &heat_level
      default: "Off"
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: Heat low
              value: Heat1
            - label: Heat medium
              value: Heat2
            - label: Heat high
              value: Heat3
            - label: Vent low
              value: Vent1
            - label: Vent medium
              value: Vent2
            - label: Vent high
              value: Vent3
    front_right_seat: *heat_level
    rear_left_seat: &heat_only_level
      default: "Off"
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: Heat low
              value: Heat1
            - label: Heat medium
              value: Heat2
            - label: Heat high
              value: Heat3
    rear_right_seat: *heat_only_level
    steering_wheel:
      default: "Off"
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: "On"
              value: Heat1
    override_charge_schedule:
      default: false
      selector:
        boolean:

update_departure_schedule:
  fields:
    device_id: *device_id
    schedule_id: &schedule_id
      required: true
      selector:
        text:
    name:
      selector:
        text:
    departure_time:
      selector:
        time:
    days:
      selector: *days_selector
    enabled:
      selector:
        boolean:
    temperature:
      selector:
        number:
          step: 0.5
          mode: box
    front_defrost:
      selector:
        select:
          options:
            - "Off"
            - Defrost
            - Defog
    front_left_seat: &optional_heat_level
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: Heat low
              value: Heat1
            - label: Heat medium
              value: Heat2
            - label: Heat high
              value: Heat3
            - label: Vent low
              value: Vent1
            - label: Vent medium
              value: Vent2
            - label: Vent high
              value: Vent3
    front_right_seat: *optional_heat_level
    rear_left_seat: &optional_heat_only_level
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: Heat low
              value: Heat1
            - label: Heat medium
              value: Heat2
            - label: Heat high
              value: Heat3
    rear_right_seat: *optional_heat_only_level
    steering_wheel:
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: "On"
              value: Heat1
    override_charge_schedule:
      selector:
        boolean:

delete_departure_schedule:
  fields:
    device_id: *device_id
    schedule_id: *schedule_id
precondition_cabin:
  fields:
    device_id: *device_id
    lead_time:
      default: 20
      selector:
        number:
          min: 20
          max: 60
          step: 5
          unit_of_measurement: min
          mode: slider
    temperature:
      selector:
        number:
          step: 0.5
          mode: box

send_location:
  fields:
    device_id: *device_id
    location:
      selector:
        location:
          radius: false

send_trip:
  fields:
    device_id: *device_id
    stops:
      required: true
      selector:
        object:
          multiple: true
          label_field: name
          translation_key: stop
          fields:
            name:
              required: true
              selector:
                text:
            location:
              selector:
                location:
                  radius: false
    arrival_range:
      default: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

end_trip:
  fields:
    device_id: *device_id
